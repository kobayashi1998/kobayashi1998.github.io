<body>
<main>

  <h1>编辑器汉化补丁</h1>

  <p>适用于《魔兽争霸 III：重制版》地图编辑器（World Editor）的纯净汉化补丁。</p>

  <h2>下载渠道</h2>
  <p>
    <a href="https://k12cs.cn/downloads/%E7%BC%96%E8%BE%91%E5%99%A8%E6%B1%89%E5%8C%96%E8%A1%A5%E4%B8%810.4.3.zip"> | <a href="https://github.com/kobayashi1998/worldeditor-zhcn/releases">Github 下载</a>
  </p>

  <h2>使用说明</h2>
  <ol>
    <li>双击 <code>AllowLocalFiles.reg</code>，在弹出的提示窗口中点击确定。</li>
    <li>将补丁中的 <code>_retail_</code> 文件夹复制到游戏根目录即可。</li>
  </ol>
  <p class="tip">补丁使游戏优先调用本地文件，不涉及修改游戏本体；删除相关文件即可移除本补丁。</p>

</main>
