<style>


*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px 80px}
.back{display:flex;align-items:center;gap:12px;margin:18px 0 0}
.theme-btn{position:fixed;top:14px;right:14px;z-index:99;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line);background:var(--bg2);color:var(--fg);font-size:12px;line-height:1;
  cursor:pointer;box-shadow:0 2px 10px var(--btn-shadow,rgba(0,0,0,.3));transition:color .15s,border-color .15s}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.back a{display:inline-block;font-size:13px;color:var(--fg2);text-decoration:none;border:1px solid var(--line);background:var(--bg2);border-radius:20px;padding:4px 13px;transition:color .15s,border-color .15s}
.back a:hover{color:var(--accent);border-color:var(--accent)}

header{padding:38px 0 24px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--head-glow),transparent)}
h1{font-size:25px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1 .badge{font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;
  background:rgba(var(--accent-rgb),.14);color:var(--accent);
  border:1px solid rgba(var(--accent-rgb),.32)}
.sub{color:var(--fg2);margin-top:10px;font-size:13px}
.sub b{color:var(--fg)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin:26px 0 6px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
  position:relative;overflow:hidden;transition:.2s;cursor:pointer;
  font:inherit;color:inherit;text-align:left;width:100%;appearance:none}
.stat:hover{transform:translateY(-2px);border-color:var(--fg3)}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.stat .n{font-size:22px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.stat .t{font-size:12.5px;color:var(--fg2);margin-top:2px;display:flex;align-items:center;gap:6px}
.stat .s{font-size:11px;color:var(--fg3)}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.lazy .ph{min-height:var(--ph,140px);display:flex;align-items:flex-start;justify-content:center;
  padding:36px 0;color:var(--fg3);font-size:12.5px}

/* 顶部加载条：数据文件下载 / 解析期间显示 */
.loadbar{position:fixed;top:0;left:0;right:0;height:4px;z-index:200;
  background:rgba(var(--accent-rgb),.16);overflow:hidden;transition:opacity .35s}
.loadbar i{position:absolute;top:0;bottom:0;width:32%;background:var(--accent);
  border-radius:0 3px 3px 0;animation:loadslide 1.15s ease-in-out infinite}
.loadbar.done{opacity:0}
@keyframes loadslide{0%{left:-32%}100%{left:100%}}
@media (prefers-reduced-motion: reduce){
  .loadbar i{width:100%;left:0;animation:none}
}
.loading-hint{padding:64px 20px;text-align:center;color:var(--fg3);font-size:13px}

.toolbar{background:var(--bg2);border:1px solid var(--line);border-radius:11px;
  margin:0 0 22px;padding:13px 16px}
.searchrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:220px;background:var(--bg3);border:1px solid var(--line);
  color:var(--fg);padding:9px 14px;border-radius:9px;font-size:14px;font-family:inherit;
  outline:none;transition:.2s}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.14)}
input[type=search]::placeholder{color:var(--fg3)}
select{background:var(--bg3);border:1px solid var(--line);color:var(--fg);padding:9px 12px;
  border-radius:9px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;max-width:230px}
.count{color:var(--fg3);font-size:12px;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

.cats{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{padding:5px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);
  color:var(--fg2);font-size:12.5px;cursor:pointer;transition:.18s;user-select:none;
  font-family:inherit;line-height:1.6;appearance:none;text-align:center}
.chip:hover{border-color:var(--fg3);color:var(--fg)}
.chip.on{background:var(--c);border-color:var(--c);color:var(--chip-on-fg);font-weight:600}

section{margin:32px 0 0;scroll-margin-top:24px}
.sect-h{display:flex;align-items:center;gap:12px;padding:0 0 13px;
  border-bottom:2px solid var(--line);margin-bottom:16px}
.sect-h .ico{font-size:20px}
.sect-h h2{font-size:18.5px;font-weight:700;color:var(--c)}
.sect-h .desc{color:var(--fg3);font-size:12.5px;margin-top:1px}
.sect-h .num{margin-left:auto;font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums;white-space:nowrap}

.subgrp{margin:20px 0 0}
.subgrp h3{font-size:13.5px;font-weight:600;color:var(--fg2);margin-bottom:9px;
  display:flex;align-items:center;gap:9px}
.subgrp h3::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--c)}
.subgrp .n{color:var(--fg3);font-size:11.5px;font-weight:400}

.tbl{overflow-x:auto;overflow-y:hidden;border-radius:10px;max-width:100%}
.tbl::-webkit-scrollbar{height:8px}
.tbl::-webkit-scrollbar-thumb{background:rgba(120,140,165,.35);border-radius:4px}
table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:10px;
  overflow:hidden;border:1px solid var(--line)}
thead{background:var(--bg3)}
th{text-align:left;padding:9px 14px;font-size:12px;font-weight:600;color:var(--fg2);
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 14px;border-bottom:1px solid var(--rowline);vertical-align:top;font-size:13px}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--rowhover)}
td.zh{color:var(--fg);font-weight:500}
td.en{color:var(--fg2);font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
td.src{color:var(--fg3);font-size:11.5px;white-space:nowrap}
td.note{color:var(--fg3);font-size:11.5px}
mark{background:var(--mark-bg);color:var(--mark-fg);border-radius:3px;padding:0 2px}

.empty{text-align:center;padding:70px 20px;color:var(--fg3)}
.empty .big{font-size:40px;margin-bottom:12px;opacity:.5}
footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);
  color:var(--fg3);font-size:12px;text-align:center;line-height:1.9}

@media(max-width:720px){
  .wrap{padding:0 14px 60px}
  .toolbar{margin:0 0 18px;padding:12px 14px}
  h1{font-size:19px}
  td.src,th.src{display:none}
  .stat .n{font-size:19px}
  select{max-width:100%}
}

  @media print{
    :root,:root[data-theme]{
      --bg:#ffffff; --bg2:#ffffff; --bg3:#ffffff; --line:#c8c8c8;
      --fg:#000000; --fg2:#333333; --fg3:#444444; --accent:#7a5f24;
      --accent-rgb:122,95,36; --chip-on-fg:#ffffff;
      --rowline:#dddddd; --rowhover:transparent;
      --mark-bg:#f3e3c0; --mark-fg:#000000; --btn-shadow:none;}
    body{background:#fff;color:#000;}
    /* 与其他页面一致：只保留标题与分类索引，隐藏交互控件与长表格 */
    .theme-btn,.back,.loadbar,.noprint,.searchrow,.stats,#body{display:none !important;}
    .toolbar{border:0;border-radius:0;background:none;padding:0;margin:0 0 4px;}
    header{padding:0 0 12px;border-bottom:1px solid #c8c8c8;background:none;}
    header h1{color:#000;}
    .cats{margin-top:8px;}
    /* 分类 chip 强制白底黑字；print-color-adjust:exact 让真实打印也保留 */
    .chip,.chip.on{-webkit-print-color-adjust:exact;print-color-adjust:exact;
      background:#fff !important;color:#000 !important;border:1px solid #999 !important;}
    .chip.on{border-color:#333 !important;font-weight:600;}
    a{color:#000;text-decoration:none;}
  }
</style>

<header>

  <div class="sub">

<script>
const META = {"icon": {"种族与势力": "🏳️", "世界观与场景": "🌍", "英雄与单位": "🦸", "技能与魔法效果": "✨", "物体数据字段": "📊", "触发器组件": "⚡", "AI 编辑器": "🤖", "编辑器界面": "🛠️", "地形与地图编辑": "🗺️", "通用与偏好": "⚙️"}, "desc": {"种族与势力": "种族、势力、单位分类（护甲 / 类型）等阵营相关术语", "世界观与场景": "战役章节、音乐主题、地表纹理、天气环境、物品分类等场景术语", "英雄与单位": "单位与英雄语音、单位命令、英雄技能、英雄属性、模型与动画", "技能与魔法效果": "技能数值字段、技能字段（实数 / 整数 / 布尔 / 字符串）、技能与魔法效果类型", "物体数据字段": "单位 / 物品 / 单位武器的各项数据字段，以及护甲、防御、移动等分类枚举", "触发器组件": "事件、条件、动作、函数、参数、触发类别等触发器术语", "AI 编辑器": "AI 编辑器函数与界面文本", "编辑器界面": "菜单、工具栏、面板、对象树、镜头、声音编辑器、载入画面等界面元素", "地形与地图编辑": "地形刷子、悬崖高度、地表纹理、路径、装饰物与可破坏物、区域", "通用与偏好": "首选项设置、通用按钮、警告错误、撤销保存、文件导出等"}, "color": {"种族与势力": "#e05c5c", "世界观与场景": "#4ea1ff", "英雄与单位": "#f0a04b", "技能与魔法效果": "#c77dff", "物体数据字段": "#5bc0be", "触发器组件": "#3ecf8e", "AI 编辑器": "#8b7cf6", "编辑器界面": "#f2c14e", "地形与地图编辑": "#5fa8d3", "通用与偏好": "#9aa5b1"}, "order": ["种族与势力", "世界观与场景", "英雄与单位", "技能与魔法效果", "物体数据字段", "触发器组件", "AI 编辑器", "编辑器界面", "地形与地图编辑", "通用与偏好"]};
const CATS = META.order;
const ICON = META.icon, DESC = META.desc;
// 夜间用：原亮色分类色
const COLOR_D = META.color;
// 日间用：同色系加深，保证白底可读（AA）
const COLOR_L = {"种族与势力":"#b8372f", "世界观与场景":"#1668b8", "英雄与单位":"#96601a",
  "技能与魔法效果":"#7b3fbf", "物体数据字段":"#17776f", "触发器组件":"#10804f",
  "AI 编辑器":"#4f3fc4", "编辑器界面":"#8a6400", "地形与地图编辑":"#1c6b93", "通用与偏好":"#5a6672"};
let COLOR = document.documentElement.getAttribute('data-theme') === 'light' ? COLOR_L : COLOR_D;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = (s, q) => {
  s = esc(s);
  if(!q) return s;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return s.replace(re, '<mark>$1</mark>');
};

let state = {q:'', cat:'', sub:''};
let total = 0;

// 统计
function buildStats(){
  total = 0;
  $('#stats').innerHTML = CATS.map(c => {
    let n = 0;
    for(const sub in TREE[c]) n += TREE[c][sub].length;
    total += n;
    return `<button type="button" class="stat" data-cat="${c}" style="--c:${COLOR[c]}">
      <div class="n">${n.toLocaleString()}</div>
      <div class="t">${ICON[c]} ${c}</div>
      <div class="s">${Object.keys(TREE[c]).length} 个子类</div>
    </button>`;
  }).join('');
  $('#total').textContent = total.toLocaleString();
  $('#catn').textContent = CATS.length;
}

// 分类标签
function buildCats(){
  $('#cats').innerHTML =
    `<button type="button" class="chip${state.cat ? '' : ' on'}" data-cat="" aria-pressed="${state.cat ? 'false' : 'true'}" style="--c:var(--accent)">全部 (${total.toLocaleString()})</button>` +
    CATS.map(c => {
      let n = 0; for(const sub in TREE[c]) n += TREE[c][sub].length;
      return `<button type="button" class="chip${state.cat === c ? ' on' : ''}" data-cat="${c}" aria-pressed="${state.cat === c}" style="--c:${COLOR[c]}">${ICON[c]} ${c} (${n.toLocaleString()})</button>`;
    }).join('');
}

let GROUPS = [], CUR_Q = '', io = null;

function collect(q, cat, subF){
  const groups = []; let shown = 0;
  for(const c of CATS){
    if(cat && c !== cat) continue;
    let subs = Object.keys(TREE[c]);
    if(subF) subs = subs.filter(s => s === subF);
    if(!subs.length) continue;
    const picked = []; let n = 0;
    for(const sub of subs){
      const rows = [];
      for(const r of TREE[c][sub]){
        const hay = (r[0]+' '+r[1]+' '+r[2]+' '+r[3]).toLowerCase();
        if(q && !hay.includes(q)) continue;
        rows.push(r);
      }
      if(!rows.length) continue;
      picked.push({sub, rows}); n += rows.length;
    }
    if(!picked.length) continue;
    shown += n;
    groups.push({c, subs:picked, n});
  }
  return {groups, shown};
}

function sectHead(g){
  return `<div class="sect-h">
      <span class="ico">${ICON[g.c]}</span>
      <div><h2>${g.c}</h2><div class="desc">${DESC[g.c]}</div></div>
      <span class="num">${g.n.toLocaleString()} 条</span>
    </div>`;
}

function tableHtml(c, sub, rows, q){
  return `<div class="subgrp">
    <h3 style="--c:${COLOR[c]}">${esc(sub)} <span class="n">${rows.length}</span></h3>
    <div class="tbl"><table>
      <thead><tr><th style="width:34%">中文译名</th><th style="width:38%">原文 / 标识</th><th class="src">来源</th><th style="width:16%">键名</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td class="zh">${hl(r[1],q)}</td>
        <td class="en">${hl(r[0],q)}</td>
        <td class="src">${esc(r[3])}</td>
        <td class="note">${hl(r[2]||'',q)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

// 只渲染分类外壳，滚动到附近再填充表格，避免一次性插入上万行
function shellHtml(g){
  return `<section class="lazy" id="sec-${g.c}" data-cat="${g.c}"
    style="--c:${COLOR[g.c]};--ph:${g.n*36 + g.subs.length*64 + 40}px">
    ${sectHead(g)}
    <div class="ph">正在加载 ${g.n.toLocaleString()} 条词条…</div>
  </section>`;
}

function mount(sec){
  if(!sec || sec.dataset.mounted) return;
  const g = GROUPS.find(x => x.c === sec.dataset.cat);
  if(!g) return;
  sec.dataset.mounted = '1';
  sec.innerHTML = sectHead(g) + g.subs.map(s => tableHtml(g.c, s.sub, s.rows, CUR_Q)).join('');
}

function setupLazy(shown){
  if(io){ io.disconnect(); io = null; }
  const secs = Array.prototype.slice.call(document.querySelectorAll('#body section.lazy'));
  if(!secs.length) return;
  // 结果较少时一次画完，省掉观察器开销
  if(shown <= 450 || !('IntersectionObserver' in window)){
    secs.forEach(s => mount(s)); return;
  }
  io = new IntersectionObserver(entries => {
    for(const en of entries){
      if(!en.isIntersecting) continue;
      mount(en.target);
      io.unobserve(en.target);
    }
  }, {rootMargin:'800px 0px'});
  secs.forEach(s => io.observe(s));
  // 首屏同步填充，避免占位块闪烁
  const vh = window.innerHeight || 800;
  secs.forEach(s => { if(s.getBoundingClientRect().top < vh + 800){ mount(s); io.unobserve(s); } });
}

function render(){
  const q = state.q.trim().toLowerCase();
  const cat = state.cat, subF = state.sub;
  CUR_Q = q;
  const res = collect(q, cat, subF);
  GROUPS = res.groups;

  $('#body').innerHTML = GROUPS.map(shellHtml).join('') ||
    `<div class="empty"><div class="big">🔍</div>没有匹配的词条<br><span style="font-size:12px">试试其他关键词，或切换分类</span></div>`;
  $('#cnt').textContent = (q || cat || subF) ? `匹配 ${res.shown.toLocaleString()} 条` : `共 ${total.toLocaleString()} 条`;
  setupLazy(res.shown);
}

function refreshSubs(){
  const sel = $('#subSel');
  const cur = sel.value;
  const opts = ['<option value="">全部子类</option>'];
  const cats = state.cat ? [state.cat] : CATS;
  for(const c of cats){
    if(!TREE[c]) continue;
    for(const s of Object.keys(TREE[c])) opts.push(`<option value="${esc(s)}">${ICON[c]} ${esc(s)}</option>`);
  }
  sel.innerHTML = opts.join('');
  if(cur && [...sel.options].some(o=>o.value===cur)) sel.value = cur;
  else { sel.value=''; state.sub=''; }
}

let qTimer = 0;
function resetScroll(){
  if(typeof window.scrollY === 'number' && window.scrollY > 120) window.scrollTo({top:0, behavior:'auto'});
}
function applyQuery(v){
  if(v === state.q) return;
  state.q = v;
  render();
  resetScroll();
}
$('#q').addEventListener('input', e => {
  const v = e.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => applyQuery(v), 180);
});
$('#q').addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  clearTimeout(qTimer);
  applyQuery(e.target.value);
});
$('#cats').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if(!chip) return;
  document.querySelectorAll('.chip').forEach(x=>{
    x.classList.remove('on');
    x.setAttribute('aria-pressed','false');
  });
  chip.classList.add('on');
  chip.setAttribute('aria-pressed','true');
  state.cat = chip.dataset.cat; state.sub = '';
  refreshSubs(); render(); resetScroll();
});
$('#stats').addEventListener('click', e => {
  const st = e.target.closest('.stat'); if(!st) return;
  const chip = document.querySelector(`.chip[data-cat="${st.dataset.cat}"]`);
  if(chip) chip.click();
});
$('#subSel').addEventListener('change', e => { state.sub = e.target.value; render(); resetScroll(); });

function boot(){
  var lb = document.getElementById('loadbar');
  try{
    buildStats();
    buildCats();
    refreshSubs();
    render();
  }catch(err){
    var b = document.getElementById('body');
    if(b) b.innerHTML = '<div class="loading-hint">词条数据加载失败，请刷新页面重试。</div>';
    if(lb) lb.classList.add('done');
    return;
  }
  // 首屏渲染完成后再收起顶部加载条
  if(lb){ lb.classList.add('done'); setTimeout(function(){ if(lb.parentNode) lb.parentNode.removeChild(lb); }, 450); }
}
// 先让浏览器画出页头与加载条，再进行上万条数据的首屏渲染
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', function(){ requestAnimationFrame(boot); });
} else {
  requestAnimationFrame(boot);
}

// ===== 日间 / 夜间模式 =====
const themeBtn = $('#themeBtn');
const isLight = () => document.documentElement.getAttribute('data-theme') === 'light';
function themeIcon(){ themeBtn.textContent = isLight() ? '🌙' : '☀️'; }
themeBtn.addEventListener('click', () => {
  const t = isLight() ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('site-theme', t); } catch(e) {}
  COLOR = t === 'light' ? COLOR_L : COLOR_D;
  themeIcon();
  buildStats();
  buildCats();
  render();
});
themeIcon();
</script>
</body>
</html>
